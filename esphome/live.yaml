# THE PRODUCTION FIRMWARE. Reads the pump's LCD and presses its three buttons,
# both exposed to Home Assistant. esphome/hauswasserwerk.yaml is the obsolete
# 10-wire parallel tap and does not match this wiring; everything else in
# esphome/ is a one-shot diagnostic.
#
# This is the follow-on to sweep.yaml. The sweep identified the bus:
#
#   VERDICT: CLOCKED  CLK=<clock>/rise  DATA=D2  MSB-first  (165 B)
#   decoded: ... Standby Mode ... Standby Mode ...
#
# reproduced across three captures.
#
# =========================== READ THIS FIRST ===============================
#
# ONE LCD header pin must NEVER sit on an ESP32-C6 GPIO:
#
#   LCD pin 0   measured -1.53 V   V0/VEE contrast bias. A negative rail
#                                  forward-biases the substrate diode.
#
# LCD pin 1 was on that list until 2026-11-11, as "measured +4.87 V, VDD". THAT
# WAS WRONG and the correction matters, because pin 1 is now deliberately on a
# GPIO. The +4.87 V came from the discredited 2026-09 voltage table, taken
# against a floating reference, which also mis-called pins 3 and 4. A meter on
# 2026-11-11 read pin 1 at 3.17 V - a 3.3 V-domain line, and exactly the DC
# average of a 3.3 V clock that idles high. Pin 1 is the CLOCK, and it is wired
# to D0/GPIO0. Standing rule: the meter outranks any inherited table.
#
# GPIO1/D1 must never be configured as an output. It is on LCD pin 3, metered
# at 0 ohms to board ground; driving it high is a dead short. It appears
# nowhere in this file.
#
# ALWAYS ON HAS NO DRY-RUN PROTECTION. The manual says it may only be operated
# under continuous observation, and Home Assistant can now reach it in two MODE
# presses from Standby. Full button access was chosen deliberately; there are
# no interlocks in this firmware.
#
# ============================================================================
#
# --- Why this exists separately from sweep.yaml ----------------------------
#
# The sweep is one-shot: it fills its buffer in about 0.4 s and then spends
# seconds analysing. A button press would essentially never land inside that
# window, and outstanding item 4 in sweep.yaml's run log - "no run yet has had
# the pump's buttons worked during the capture window" - is not fixable by
# timing the press better. It needs a decoder that never stops.
#
# So this one runs continuously. It frames on the idle gap between refreshes,
# decodes each frame, and logs it ONLY when the content differs from the
# previous frame. The panel refreshes about ten times a second; without the
# repeat suppression the log would be a wall of identical lines and the one
# thing being watched for - a change - would scroll past unread.
#
# --- How to use it ---------------------------------------------------------
#
#   1. Flash with logs attached. Do NOT use --no-logs and reconnect after:
#      run 7 of the sweep was lost exactly that way, because the log is not
#      replayed across a reconnect.
#
#        Remove-Item Env:MSYSTEM -ErrorAction SilentlyContinue
#        .\.venv\Scripts\python.exe -m esphome run esphome\live.yaml --device COM3
#
#   2. Wait for the first frame to print. That is the current screen. An
#      unchanged screen is re-printed every 10 s, so silence means no traffic,
#      not a suppressed repeat.
#   3. Press a button on the pump. A new line should appear within ~100 ms.
#
# --- Reading the output ----------------------------------------------------
#
#   [  Standby Mode  ][                ]
#
# One bracket per display line, exactly as the panel shows it, padding and
# all. A '?' is a character that decoded outside printable ASCII - almost
# always a slipped clock edge, and it stays in its column so a one-cell glitch
# reads as a glitch rather than silently shortening the line. DEBUG adds the
# raw frame hex, the held-frame counts and 30 s statistics.
#
# --- The protocol, as measured ---------------------------------------------
#
# 10 frames/s, 376 bits each, 0 dropped samples over minutes of capture.
#
#   9-bit words     one flag bit, then eight data bits MSB-first
#   7C 40           introduces a display line; 16 character words follow
#   line 2          starts TWO BITS out of phase with line 1
#
# That last point is the whole reason a fixed alignment cannot work, and it is
# what defeated the sweep: assuming 8-bit words, every ninth bit shifts the
# stream, so text appeared only when a run happened to start on a lucky
# alignment. The frame also carries a leading word group and an inter-line
# group that are not yet identified - they are skipped, not decoded.
#
# --- Run log ---------------------------------------------------------------
#
# Record what each button does here. That mapping is the point of this
# firmware and is not recoverable from anywhere else.
#
# --- Run 1, 2026-09-18, one button press -----------------------------------
#
#   before   [   Time Mode    ][    NOT SET     ]
#   after    [  Standby Mode  ][                ]
#
# Also observed in the same session:
#
#            [   Always On    ][Not Recommended ]
#
# Which physical button was pressed was not recorded.
#
# --- Run 2, 2026-09-18, debounced build ------------------------------------
#
# stable_frames: 2 added after run 1 logged spurious changes from single-bit
# corruption ("Sta~dby Mode", a stray backtick in line 2). It works: 2.5 min
# at 10.0 frames/s, 572k edges, 0 dropped, 0 undecoded, 23 garbled cells, and
# not one spurious change line. Every one of those 23 would have printed a
# bogus screen under run 1's build.
#
# Button mapping, one press at a time. MODE walks a cycle:
#
#   MODE x1   [  Standby Mode  ]  ->  [ Automatic Mode ]
#   MODE x1   [ Automatic Mode ]  ->  [   Time Mode    ]
#   MODE x1   [   Time Mode    ]  ->  [   Always On    ]
#   MODE x1   [   Always On    ]  ->  [  Standby Mode  ]   wraps
#
# Four positions, every leg measured. Standby, Automatic, Time, Always On.
#
# Run 1's [Time Mode][NOT SET] -> [Standby Mode] looked like a contradiction
# until the wrap was measured. It is not: run 1 also saw Always On in the same
# session, so its two logged lines were not adjacent presses - the Always On
# step sat between them. Two log lines being consecutive in the log does not
# make them consecutive in the panel's state machine.
#
# A press is not one screen change. Pressing MODE into Time Mode produced:
#
#   +0.0 s   [   Time Mode    ][                ]   title flash
#   +0.8 s   [Time Now   00:00][Save  Set   Exit]   menu opens by itself
#   +21 s    [   Time Mode    ][    NOT SET     ]   menu times out by itself
#
# Only the first is the button. Attributing the later two to a press would be
# wrong, and they arrive slowly enough to look like separate presses.
#
# Distinguishing a change from the 10 s re-print: a change prints off-cadence.
# The first MODE press landed at :57.686 with re-prints running on :49 and :59.
#
# --- The panel truncates the frame rather than sending a blank line ---------
#
# About 30 s after settling in Automatic Mode the frame halved, 382 bits to
# 191, and held there for 303 frames:
#
#   382 bits | 7C 40 ... 51 00 F8 80 60 0F 84 01 00 80 40 ... 02 00
#   191 bits | 7C 40 ... 51 00
#
# So a screen with no second line is a SHORT FRAME, not a frame carrying 16
# spaces - and both occur. [ Automatic Mode ] with one line and
# [ Automatic Mode ][                ] are different panel states, not a
# decode glitch. Anything that assumes a fixed frame length breaks here.
#
# --- Line 2 of the Always On screen BLINKS at 1 Hz --------------------------
#
#   [   Always On    ][Not Recommended ]   5 frames
#   [   Always On    ][                ]   5 frames, repeating
#
# 500 ms per half at 10 frames/s. The panel, not the decoder: the second
# half-frame alternates between two fixed byte patterns of identical length,
#
#   84 02 71 BC E8 20 29 19 4C 66 F3 69 B4 CA 6E 32 19 4C 82 00   "Not Recommended"
#   84 01 00 80 40 20 10 08 04 02 01 00 80 40 20 10 08 04 02 00   blank
#
# with the first half byte-identical throughout. It is a flashing warning
# about running the pump permanently on.
#
# Consequence for any consumer of this data: a blinking screen publishes a
# text_sensor change every 500 ms forever. stable_frames cannot fix that -
# the blink is stable, it is real. Anything downstream needs to either hold
# the last non-blank line 2 or treat a 1 Hz alternation as one state.
#
# === Run 3, 2026-09-18: published to Home Assistant ==========================
#
# Added `blank_hold` and trimming, flashed, and read the entity values back
# off the device's own web server rather than off the log, so what is checked
# is what HA will actually receive:
#
#   text_sensor/Display Line 1  value "Standby Mode"   (not "  Standby Mode  ")
#   text_sensor/Display Line 2  value ""
#
# Both correct. Line 2 is the 16-space blank of a full 382-bit Standby frame,
# so it is a REAL blank, and it published - the hold delays a true blank by
# 1.5 s, it does not swallow it. Blink suppression on the Always On screen is
# implemented against the byte patterns recorded above but has not yet been
# watched live; that needs a physical walk round to Always On.
#
# --- Unexpected: the web server costs frames --------------------------------
#
# Steady state on this run was `0 dropped`. Holding the web server's /events
# SSE stream open took it to `16.1 frames/s, 277 dropped, 54 garbled` - the
# frame rate fell by 80% and the ISR started losing edges. One 160 MHz core is
# serving an interrupt at ~3.8 kedges/s and streaming HTTP, and the HTTP wins.
#
# So: do not leave a browser sitting on http://<device>/ while capturing. The
# native API is a binary push and does not show this, which is the reason HA
# is a fine consumer of this data and the web UI is a debugging tool only. If
# dropped samples ever appear during real protocol work, check for an open
# web page before suspecting the wiring.
#
# === Run 4, 2026-09-19: six pin sensors added, and a WIRING REGRESSION =======
#
# The six pin binary sensors cost the tap nothing, exactly as intended:
#
#   10.0 frames/s, 0 dropped, sustained over 3.5 minutes
#
# use_interrupt: false is what buys that - see the comment on the block itself.
#
# --- But the decode quality has fallen off a cliff since run 2 --------------
#
#   run 2    2.5 min, 572k edges, 0 dropped, 0 undecoded,  23 garbled cells
#   run 4    2.5 min, 520k edges, 0 dropped, 161 undecoded, 3156 garbled
#
# 23 garbled cells to over 3000 is not a drift, and the frame lengths say why.
# The protocol is 382 bits, or 191 for a short frame. Observed in run 4:
#
#   397  396  395  337  321  300  290  279  bits
#
# Both directions at once: frames LONGER than 382 (extra clock edges - bounce)
# and frames much shorter (missed edges). Several start with a run of FF FF FF,
# which is a line sitting high through what should have been clocked data.
#
# --- The evidence points at the D2 (data) solder joint ----------------------
#
# Comparing the same two lines between sweep runs, which is the cleanest
# like-for-like available because both are whole-port captures:
#
#              run 4-8 (2026-09-18)      run 9 (2026-09-19)
#   D1 clock   6648 edge/s, 76% solo     5256 edge/s, 70% solo
#   D2 data    1186 edge/s, 12% solo     2537 edge/s, 49% solo
#
# D2's edge rate more than DOUBLED and its solitary fraction went 12% -> 49%.
# Solitary means the line changed with no other line changing in the same port
# read. On a synchronous bus the data line moves next to its clock; that is
# what the 12% was. Half its edges now arriving on their own is roughly 1000
# extra transitions a second that no clock asked for. Display content cannot
# explain a 4x change in that ratio.
#
# The likely cause is mechanical. D1 and D2 are hand-soldered to the display
# and the board has been handled repeatedly to fit the six header wires. This
# project has lost two runs to a loose wire already.
#
# NOT caused by the binary sensors. The degraded D2 numbers above were measured
# by sweep.yaml, which contains no binary_sensor block at all. The regression
# predates this firmware.
#
# ACTION: reflow or reseat D1 and D2 and re-run. Until then, treat garbled
# cells as a wiring fault rather than a decoder defect - the text still comes
# out right, but the margin is gone.
#
# === Run 5, 2026-11-11: the real clock, three buttons, and the regression is
# === gone ====================================================================
#
# First run on the re-soldered wiring: clock moved GPIO1 -> GPIO0 (LCD pin 1),
# all three buttons wired, stable_frames 2 -> 3. Decoded correctly on the first
# flash, no edge flip needed:
#
#   [  Standby Mode  ][                ]
#   382 bits | 7C 40 20 07 C2 00 80 40 53 3A 18 4D C6 43 11 E4 40 4D 37 99 ...
#
# THE BEST NUMBERS THIS PROJECT HAS SEEN:
#
#   run 2  (2026-09-18)  2.5 min   0 dropped,   0 undecoded,    23 garbled
#   run 4  (2026-09-19)  2.5 min   0 dropped, 161 undecoded,  3156 garbled
#   run 5  (2026-11-11)  95 s      0 dropped,   0 undecoded,     2 garbled
#
# 343363 edges, 10.0 frames/s throughout. Two conclusions, both of which had
# been open questions:
#
#   1. The D2 solder joint blamed for run 4 is fixed. Run 4's ACTION above is
#      discharged.
#   2. THE CLOCK WIRE EARNS ITS PLACE. Recovering the bit period from the data
#      line alone decodes 98.9% of frames (1380/1395 over two off-device
#      walks); sampling on the real clock gives 2 bad cells in ~950 frames,
#      roughly 0.007% of cells. The README section that said the clock "does
#      not automatically fix the ~1% bit slips" has been corrected.
#
# --- Run 5b: the full MODE cycle, driven from the network --------------------
#
# Pressed through tools/press.py over the native API (the web_server REST
# endpoints all return 404 on this build - see below). Every leg observed:
#
#   Standby Mode   -> Automatic Mode
#   Automatic Mode -> Time Mode
#     +2 s   [Time Now   00:00][Save  Set   Exit]   menu opens by itself
#     +20 s  [   Time Mode    ][    NOT SET     ]   times out by itself
#   Time Mode      -> Always On
#   Always On      -> Standby Mode                  wraps
#
# Same cycle tools/walk.py reproduced twice off-device. Known-answer test
# passed.
#
# --- THE SOFT KEY MAPPING, MEASURED - this is the new information ------------
#
# Physical order is SAVE (left), SET (middle), MODE (right), and the labels map
# positionally onto it:
#
#   screen                         left/SAVE   middle/SET   right/MODE
#   [Time Now 00:00] resting       Save        Set          Exit
#   editing digits                 Next        +            -
#
# Verified by EFFECT, not just by reading the labels: SET on the resting screen
# entered edit mode, and SAVE in edit mode moved the cursor from hours to
# minutes - it acted as `Next`, the leftmost label.
#
# !! IN EDIT MODE, MODE IS `-`, NOT `Exit`. Pressing MODE to get out would
# decrement the clock. The edit menu times out by itself in ~20 s back to
# [Time Mode][NOT SET] with nothing changed. That is the way out.
#
# The field being edited BLINKS at ~1 Hz: `Time Now   00:00` alternating with
# `Time Now     :00` is hours selected, `Time Now   00:  ` is minutes. So the
# blink is a cursor here, not only the Always On warning - note that blank_hold
# will smear it.
#
# !! UNRESOLVED: the label row is line 2 on the resting screen but line 1 on
# the edit screen. Either the panel genuinely swaps rows, or order-based line
# slotting mis-assigns on that screen. Needs someone to look at the glass.
#
# --- The carry-forward fix, observed working ---------------------------------
#
#   [   Always On    ][    NOT SET     ]    <- line 2 held from Time Mode
#   [  Standby Mode  ][Not Recommended ]    <- line 2 held from Always On
#
# Both are short frames that redrew only line 1, and the previous build would
# have published an empty line 2 for them. The panel really is still showing
# the old text at that instant.
#
# --- web_server REST is NOT available on this build --------------------------
#
# GET and POST to /button/<id>, /button/<id>/press, /text_sensor/<id> and
# /sensor/<id> all return 404; only the SPA and /events are served. Tested
# explicitly that a GET to the press path does NOT actuate the button before
# 404ing. Use the native API (tools/press.py), which is the path Home Assistant
# uses anyway.
#
# --- The state change at 04:02:45 was a press, and it was expected -----------
#
# The pump advanced Standby -> Automatic -> Time Mode in 3.3 s after 16 minutes
# of steady Standby, with no press from this session's tooling. The user
# confirmed it: they triggered the button once from Home Assistant.
#
# So this is NOT a fault, and in particular it is NOT the GPIO16/UART0-TX boot
# burst - that was already ruled out by the absence of any reset or OTA in the
# log. It is the first end-to-end confirmation that the Home Assistant button
# actually drives the pump.
#
# !! The reason it looked alarming is worth keeping: an ESPHome button press
# does NOT appear in this log even at DEBUG - confirmed against two presses of
# our own. Log silence is not evidence that nothing was pressed. If a future
# state change needs attributing, the log cannot do it; ask, or add an explicit
# ESP_LOGI to the press scripts.
#
# ? Still loose: one press produced TWO mode advances (Standby -> Automatic ->
# Time Mode). One HA press should advance one step. Either the button was
# pressed twice, or the pump's own debounce split the 120 ms pulse. If it
# recurs, shorten ${press_ms} and watch whether double-advances stop.
#
# --- Run 6, 2026-11-11 04:44 - the English rename, flashed by OTA ------------
#
# friendly_name Hauswasserwerk -> Water Pump, node hauswasserwerk-live ->
# water-pump. OTA to 192.168.178.58 (mDNS cannot be used for this hop: the new
# hostname does not exist until the node running the new firmware announces
# it, and this PC is on a different subnet anyway).
#
# Verified after the reboot:
#
#   device name : water-pump | Water Pump
#   buttons     : press_mode, press_set, press_save
#   text sensors: display_line_1 = 'Standby Mode', display_line_2 = ''
#   decode      : 10.0 frames/s, 457995 edges, 0 dropped, 0 UNDECODED, 33 garbled
#
# ++ EVIDENCE ON THE GPIO16 BOOT BURST: this OTA reset the ESP with the pump
# sitting in Standby, and the pump was still in Standby afterwards. The burst
# did not register as a SAVE press. One observation, on one screen - Standby
# has no soft keys, so it is the screen least likely to react - but it is the
# first direct test the hazard has had, and it passed.

substitutions:
  # ENGLISH THROUGHOUT, changed 2026-11-11 at the user's request. Everything a
  # person reads in Home Assistant comes from ${friendly_name}, so this one
  # line renames the device and every entity under it.
  #
  # The node name was `hauswasserwerk-live`. The `-live` suffix existed only to
  # avoid an mDNS collision with the superseded esphome/hauswasserwerk.yaml,
  # whose node is plain `hauswasserwerk` - two nodes claiming one hostname is a
  # genuinely confusing failure. `water-pump` does not collide with it either,
  # so the suffix is no longer needed and "Live" stops leaking into entity IDs.
  #
  # !! RENAMING CHANGES EVERY ENTITY ID. `sensor.hauswasserwerk_display_line_1`
  # becomes `sensor.water_pump_display_line_1`, and so on for all five. After
  # flashing this, Home Assistant will show the old entities as unavailable -
  # delete the old device under Settings > Devices & Services > ESPHome and
  # re-adopt. The homeassistant/*.yaml in this repo already use the new IDs.
  name: water-pump
  friendly_name: Water Pump

  # --- The three buttons ----------------------------------------------------
  #
  # All three share a common GND on the pump's button board, so each one is a
  # single GPIO pulled low - no second wire, no isolated switch part. This
  # replaced the old mode_pin_a/mode_pin_b pair, which existed only because
  # nobody had metered which of the MODE switch's two terminals was grounded.
  # GPIO17/D7 is freed by that and is left unconfigured.
  save_pin: GPIO16 # D6
  set_pin: GPIO18  # D10
  mode_pin: GPIO19 # D8

  # The README specifies 100-120 ms for button injection. Long enough that the
  # panel's own debounce accepts it, short enough not to read as a press-hold.
  press_ms: 120ms

packages:
  common: !include common.yaml

clocked_tap:
  id: lcd_serial

  # CLOCK = LCD header pin 1 on XIAO D0/GPIO0. DATA = LCD header pin 2 on
  # D2/GPIO2.
  #
  # The clock moved here on 2026-11-11. Runs 1-4 below ran it on GPIO1 and
  # decoded fine - that was the OLD wiring, before the re-solder. GPIO1 is now
  # ground. Nothing was broken; the wire moved, and this is the re-point.
  #
  # Pin 1 is the clock on four independent measurements (captures/2026-11-11-
  # lcd-pin1-clock.txt): 383 pulses per frame against the protocol's 382 bits,
  # 26 us modal period against the recovered T = 25.50 us, a 9696 us frame span
  # against the data line's 9708 us, and a predicted 3.16 V DC average against
  # 3.17 V metered. It is gated with the data, not free-running.
  clock_pin:
    number: GPIO0
    mode:
      input: true
  data_pin:
    number: GPIO2
    mode:
      input: true

  # Rising. The old clock was described as idling high with ~11 us low pulses,
  # so data is valid on the rising edge - and the new pin-1 capture shows the
  # same signature, idle high with LOW runs of 11-12 us. If the lines decode as
  # garbage this is the one thing to flip; it is the only empirical setting
  # left in this block. MSB-first is what produced "Standby Mode".
  edge: rising
  bit_order: msb_first

  # D1's measured gap histogram is sharply bimodal - intra-frame clock gaps
  # top out around 64 us, frames are up to 90 ms apart. 1 ms sits in the empty
  # middle, 16x above the fastest gap and 32x below the slowest, so framing is
  # not sensitive to this number.
  frame_gap: 1ms

  # NINE bits per word, not eight: one flag bit then the byte, MSB-first. This
  # is why the sweep could never render the screen - it assumed 8-bit words, so
  # every ninth bit shifted the whole stream and the text only survived in
  # whichever run happened to land on a lucky alignment.
  word_bits: 9

  # Each display line is introduced by payload bytes 7C 40. Read off a captured
  # frame; it is the only thing that appears exactly once per line. The decoder
  # hunts this at every bit position, which is what lets it render both lines -
  # in the measured frame, line 2 starts two bits out of phase with line 1.
  line_marker: [0x7C, 0x40]
  columns: 16

  # Three identical frames before a screen counts, up from the default 2.
  #
  # The off-device analysis settled this: ~1% of frames carry a single bit slip
  # (1380 of 1395 clean across two independent MODE walks), and a 3-frame
  # majority vote over the same captures left 0 bad screens out of 1391
  # windows. A slipped frame does not match a clean one, so requiring three
  # matches rejects it by the same mechanism. Costs 100 ms of latency at 10
  # frames/s. Run 2 below showed 2 was already enough on good wiring - drop
  # back if latency ever matters more than margin.
  stable_frames: 3

  # The 1 Hz blink documented above, handled. A line going blank has to STAY
  # blank for this long before the blank is published to Home Assistant, so
  # the Always On warning's 500 ms off-half never reaches the recorder while a
  # genuine blank line - Standby Mode's second line - still gets through, just
  # 1.5 s late. The log is untouched by this and keeps showing the blink.
  blank_hold: 1500ms

  # Set true to log every frame including repeats. Useful for measuring the
  # refresh rate, far too chatty to watch a button press through.
  log_repeats: false

  # What Home Assistant gets. Published values are trimmed of the panel's
  # centring spaces; the log stays padded and verbatim, because protocol work
  # needs to see the real 16 columns.
  #
  # Two lines, published as they are read. There is deliberately no "Pump
  # Mode" entity here, because line 1 is not always a mode - on the Time
  # screen it reads `Time Now   00:00`. Anything that maps text to a mode is a
  # guess about panel behaviour, and it belongs in a Home Assistant template
  # where it can be fixed without a reflash, not baked into firmware.
  line_1:
    id: disp_line_1
    name: "Display Line 1"
    icon: mdi:format-text
  line_2:
    id: disp_line_2
    name: "Display Line 2"
    icon: mdi:format-text

# --- Button injection: all three buttons -------------------------------------
#
# The three front-panel buttons SHARE A COMMON GND. That is what makes each one
# a single wire: "press the button" and "pull its line down to 0 V" are the
# same electrical event, and a GPIO can do that by itself. Without a grounded
# side it could not - a GPIO can only connect a line to one of its own rails,
# never to another line, which is what an isolated switch part would have been
# for.
#
# OPEN DRAIN IS THE SAFETY PROPERTY, not a style preference. An open-drain pin
# can only ever sink. It cannot put 3.3 V onto a line the pump's MCU is
# driving, so the worst case if a wire is on the wrong pad is a pin held low,
# not two push-pull drivers fighting. `inverted: true` makes `turn_on` mean
# "pressed", and makes the off state a release rather than a pull-down.
#
# NOTHING PRESSES A BUTTON ON BOOT, EVER. Each pin is a plain high-Z input
# until setup runs and then is released, so there is no phantom press through
# boot, OTA or a watchdog reset.
#
# The press current returns through the existing 0 V bond. It is pull-up
# current, sub-milliamp.
#
# --- THE BUTTONS ARE SOFT KEYS -----------------------------------------------
#
# The panel paints a changing label over each button, and the mapping is
# POSITIONAL - measured 2026-11-11 by pressing each key and reading the effect:
#
#   screen                     left/SAVE   middle/SET   right/MODE
#   `Time Now 00:00` resting   Save        Set          Exit
#   editing digits             Next        +            -
#
# So the same physical button does different things on different screens, and
# these entities are named for the PHYSICAL key. Nothing here maps a key to a
# function, because nothing here can know which screen is up.
#
# Any future "set the pump's clock from Home Assistant" automation must READ
# THE LABEL ROW AND THEN PRESS, never follow a fixed press sequence. That is
# the whole payoff of having the display decoded.
#
# !! Note it is "the label row", not "line 2": on the resting screen the labels
# decode to line 2, on the edit screen to line 1. Unresolved whether the panel
# swaps rows or whether order-based slotting mis-assigns there. The Lovelace
# card in homeassistant/ sidesteps it by picking whichever line CONTAINS
# labels, which is correct either way.
#
# --- GPIO16 HAZARD, accepted 2026-11-11 --------------------------------------
#
# GPIO16 is UART0 TX. The ESP32 mask-ROM bootloader drives it at 115200 baud on
# every reset and every OTA, before any firmware runs, and nothing in ESPHome
# can suppress that. So a short serial burst lands on the SAVE line at each
# power-up. Each bit is ~8.7 us, orders of magnitude below any button debounce,
# so it should register as nothing - and the decision was to leave the wire
# where it is rather than re-solder.
#
# IF THE PUMP EVER CHANGES STATE BY ITSELF RIGHT AFTER AN ESP RESET OR OTA,
# THIS IS THE FIRST SUSPECT. The fix is to move the SAVE wire to D7/GPIO17,
# which is UART0 RX - an input the ROM never drives - and is free. That is a
# dupont move on the button connector, NOT on the LCD header.
output:
  - platform: gpio
    id: save_line
    pin:
      number: ${save_pin}
      mode:
        output: true
        open_drain: true
      inverted: true

  - platform: gpio
    id: set_line
    pin:
      number: ${set_pin}
      mode:
        output: true
        open_drain: true
      inverted: true

  - platform: gpio
    id: mode_line
    pin:
      number: ${mode_pin}
      mode:
        output: true
        open_drain: true
      inverted: true

# One script per button, all the same shape. `single` drops an overlapping run
# rather than queueing it, so a double click in the HA UI cannot stack two
# presses or leave the line held low by one run while the other releases it.
#
# The 400 ms tail is not padding. The panel is not done when the contact opens:
# a press into Time Mode produces three screens over 21 s as its menu opens and
# times out by itself, and the mode only advances one position per press.
# Holding the script busy briefly keeps a rattled button from outrunning the
# display.
script:
  - id: press_mode
    mode: single
    then:
      - output.turn_on: mode_line
      - delay: ${press_ms}
      - output.turn_off: mode_line
      - delay: 400ms

  - id: press_set
    mode: single
    then:
      - output.turn_on: set_line
      - delay: ${press_ms}
      - output.turn_off: set_line
      - delay: 400ms

  - id: press_save
    mode: single
    then:
      - output.turn_on: save_line
      - delay: ${press_ms}
      - output.turn_off: save_line
      - delay: 400ms

button:
  - platform: template
    name: "Press MODE"
    icon: mdi:gesture-tap-button
    on_press:
      - script.execute: press_mode

  - platform: template
    name: "Press SET"
    icon: mdi:gesture-tap-button
    on_press:
      - script.execute: press_set

  - platform: template
    name: "Press SAVE"
    icon: mdi:gesture-tap-button
    on_press:
      - script.execute: press_save

# The remaining unclaimed pins, exposed raw. Diagnostic only - the bus question
# these were added to answer has since been answered (see the sweep result in
# the README), so this block is a convenience now, not evidence.
#
# This is the other half of the 6-pin investigation, and it covers what
# sweep.yaml structurally cannot. The sweep's buffer fills in a fraction of a
# second, so a human reaching for a front-panel button will never land inside
# its window. Here the state just sits in Home Assistant: press every control
# on the pump in turn, let it run, and watch which row flips.
#
# HOW TO READ A FROZEN ROW. delayed_on_off makes a line publish only after it
# has HELD a level for 100 ms. That is not just debounce:
#
#   a button press lasts hundreds of ms   -> fully visible
#   a 6 kHz bus line never holds 100 ms   -> publishes NOTHING, sits frozen
#                                            at whatever it read at boot
#
# So a row that never moves is ambiguous by design - static line OR fast bus -
# and the sweep is what tells those apart. It is the right trade here: without
# the filter a line sharing a net with the clock would write thousands of
# states a second into HA's recorder.
#
# use_interrupt: false is NOT a detail. ESPHome's gpio binary_sensor defaults
# to use_interrupt: true, which would attach an any-edge ISR to each of these
# six. If one of them turns out to share a net with the display clock, that is
# 6650 extra interrupts a second landing on the same core as clocked_tap's own
# ISR - and the tap is already sensitive enough that a held-open web UI dropped
# it from 90 frames/s to 16. Polling costs a few register reads per loop() and
# loses nothing here, because delayed_on_off has already thrown away everything
# faster than 100 ms.
#
# Watch the frame-rate line in the log after flashing anyway. If it fell, this
# block is the first thing to remove.
binary_sensor:
  - platform: gpio
    name: "Pin D3"
    pin: {number: GPIO21, mode: {input: true}}
    entity_category: diagnostic
    use_interrupt: false
    filters: [delayed_on_off: 100ms]
  - platform: gpio
    name: "Pin D4"
    pin: {number: GPIO22, mode: {input: true}}
    entity_category: diagnostic
    use_interrupt: false
    filters: [delayed_on_off: 100ms]
  - platform: gpio
    name: "Pin D5"
    pin: {number: GPIO23, mode: {input: true}}
    entity_category: diagnostic
    use_interrupt: false
    filters: [delayed_on_off: 100ms]
  - platform: gpio
    name: "Pin D9"
    pin: {number: GPIO20, mode: {input: true}}
    entity_category: diagnostic
    use_interrupt: false
    filters: [delayed_on_off: 100ms]
  #
  # D6/GPIO16 and D10/GPIO18 were here and are GONE as of 2026-11-11. They are
  # the SAVE and SET button outputs now, and a pin cannot be an open-drain
  # output and a gpio binary_sensor at once. D0/GPIO0 is likewise absent: it is
  # the clock, owned by clocked_tap's ISR. D1/GPIO1 is ground and appears
  # nowhere in this file.
  #
  # So this block is down to four: D4, D5 and D9 (LCD header pins 4, 7 and 5 -
  # the static lines), plus D3, which is unwired and reads whatever it floats
  # to.

# DEBUG globally so clocked_tap emits the per-frame hex dump, the repeat
# counts and the 30 s edge statistics - the hex is what any further protocol
# work has to be done against. Everything that would otherwise bury those is
# pinned back to INFO by tag; WiFi in particular logs every scan result.
# Drop the whole thing to `level: INFO` once the decode is settled and the
# only thing being watched is the text.
logger:
  level: DEBUG
  logs:
    wifi: INFO
    wifi_esp32: INFO
    api: INFO
    api.service: INFO
    component: INFO
    scheduler: INFO
    sensor: INFO
    text_sensor: INFO
    mdns: INFO
    web_server: INFO

# Combined single entity for the device page (a Lovelace card cannot live there).
text_sensor:
  - platform: template
    name: "Display"
    id: disp_combined
    icon: mdi:monitor
    update_interval: 2s
    lambda: |-
      return {id(disp_line_1).state + "\n" + id(disp_line_2).state};
