# Shared base for every firmware in this repo.
#
# Included as an ESPHome package. Expects the including file to define the
# ${name} and ${friendly_name} substitutions.
#
# Everything here was validated on real hardware with the original UART probe
# build: the board joins WiFi, resolves over mDNS, and serves its web UI.

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    # Priority 800 runs after hardware init but before WiFi comes up, so the
    # antenna path is settled before the radio is used.
    priority: 800
    then:
      - output.turn_off: rf_switch_enable
      - output.turn_off: antenna_select

esp32:
  board: seeed_xiao_esp32c6
  framework:
    # ESP32-C6 is only supported via ESP-IDF, not the Arduino framework.
    type: esp-idf

# Local C++ components live in esphome/components/.
external_components:
  - source:
      type: local
      path: components

# --- Antenna ---------------------------------------------------------------
# The XIAO ESP32C6 routes its radio through an RF switch. Seeed's docs are
# inconsistent about which of GPIO3/GPIO14 is "enable" and which is "select",
# so both are driven LOW: under either reading that selects the on-board
# ceramic antenna. Measured -42 dBm with this setting.
output:
  - platform: gpio
    pin: GPIO3
    id: rf_switch_enable
  - platform: gpio
    pin: GPIO14
    id: antenna_select

# --- Connectivity ----------------------------------------------------------
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Raises its own hotspot if the network is unreachable, so the board in the
  # cellar never becomes unrecoverable without a USB cable.
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ap_password

captive_portal:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  port: 80

logger:
  level: DEBUG
  # Native USB port, so logging never depends on the tap pin assignment.
  hardware_uart: USB_SERIAL_JTAG

# --- Diagnostics -----------------------------------------------------------
sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
    entity_category: diagnostic

  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      entity_category: diagnostic

button:
  - platform: restart
    name: "Restart"
    entity_category: diagnostic
