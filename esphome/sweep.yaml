# Bus sweep - identify a header by brute force.
#
# CURRENT TARGET: the 6-pin connector near the display (XIAO D3, D4, D5, D6,
# D9, D10), captured WHILE THIS FIRMWARE PRESSES THE PANEL'S MODE BUTTON.
#
# THE HEADLINE QUESTION IS ANSWERED, AND THE ANSWER IS NO. Neither the display
# clock nor the data is among the six. Run 9 said so from silence; run 16
# proved it properly, with D1-CLK, D2-DAT and D6 all moving in one buffer:
# 88.4% and 86.5% level disagreement across two captures (the value
# independence predicts), and a best CLOCKED score of 0.5 with D6 as clock.
#
# THE SOLDERED D1/D2 TAP STAYS. It is the only way to read this display.
#
# Per line, as of run 16:
#   D3, D4   floating - mains pickup, 100% solitary. Reseat before believing
#            anything about them; they are untested, not tested-negative.
#   D5, D9   static HIGH in every capture, idle and provoked alike.
#   D10      as D5/D9. The only edges these three have ever produced are 2-5
#            us blips coincident with the MODE contact switching - crosstalk,
#            not a response (run 15). They are not button lines.
#   D6       the only one of the six carrying signal. Frame-synchronous
#            bursts, holds HIGH for the length of a MODE press, uncorrelated
#            with the display bus. Latch, chip-select or busy flag.
#
# WHAT IS LEFT IS A METER JOB, NOT A FIRMWARE JOB. DC volts on all six against
# the bonded ground with the pump unplugged. More sweeps will not identify a
# line that is static in every capture.
#
# The remaining firmware question: what ARE they? Run 9 left four of the six sitting static
# HIGH with zero edges, which is what a pulled-up BUTTON INPUT looks like when
# nobody is pressing the button, and equally what a dead test header looks
# like. Nothing distinguishes those two without stimulus, and runs 1-9 applied
# none. So this firmware drives the MODE switch itself, four presses inside a
# window it opened, and the result is read as a difference against the idle
# baseline the same firmware captures at boot.
#
# =========================== READ THIS FIRST ===============================
#
# NONE OF THE SIX HAVE BEEN METERED. A 6-pin connector almost always carries a
# supply and a ground, and C6 GPIOs are not 5 V tolerant. If one of these is a
# 5 V rail it is clamping through the protection diodes right now. Meter all
# six against the bonded ground and pull anything above 3.3 V.
#
# The precedent is the LCD header, where pin 1 read +4.87 V (VDD) and pin 0
# read -1.53 V (V0/VEE contrast bias - a negative rail has no tolerance margin
# at all, it forward-biases the substrate diode directly). Those two are no
# longer in this tap. Nothing says this connector is kinder.
#
# The six tapped lines are inputs and are never driven, and the report names
# which XIAO pin each line landed on. But meter them before leaving the thing
# powered.
#
# THIS FIRMWARE NOW ACTUATES THE PUMP. Runs 1-9 were listen-only and the banner
# used to say so. It no longer can: D7/D8 are driven open-drain to press the
# panel's MODE button, and pressing MODE four times walks the panel through all
# four modes - INCLUDING ~420 ms in Always On, which is the mode with no dry-
# run protection. The cycle ends where it started, so the pump is left in its
# original mode, but it is a real press on a real appliance and the sequence
# fires on a button in Home Assistant with no confirmation. Do not run it with
# the pump in a state where a brief Always On would matter.
#
# The drive is open-drain, so it can only sink: the ESP cannot push 3.3 V onto
# a line the pump's MCU is driving. That is the property that makes this safe
# to do at all, and it is why the pins are configured the way they are rather
# than as ordinary outputs.
#
# SEPARATE HAZARD, D6 = GPIO16 = UART0 TX. The mask-ROM bootloader prints its
# banner on that pin at 115200 at EVERY reset, before any firmware runs.
# ESPHome cannot suppress it: common.yaml logs over USB_SERIAL_JTAG, so UART0
# is unclaimed once booted and the pin sits as a plain input, but the boot
# burst has been going into that pump-board line on every power-up and every
# OTA. Harmless at 3.3 V into a logic input, and it is over long before the
# capture starts. If the pump ever twitches right after an ESP reset, this is
# the first suspect - move that wire to D0 (GPIO0), which is free now.
#
# ============================================================================
#
# --- What this does --------------------------------------------------------
#
# Captures every edge on all ten lines into one buffer, then replays that same
# buffer under every hypothesis it knows:
#
#   HD44780   every ordered (E, RS, D4-D7) assignment
#   UART      each line as TX, at each standard baud, 8N1
#   CLOCKED   each clock/data pair, both polarities, both bit orders, all
#             eight byte alignments
#
# It also runs a test that is not a hypothesis at all: NET IDENTITY. Two pins
# on one physical wire must read the same level in every sample, because a
# sample is one atomic port read and there is no skew to explain a difference
# away. Counting level disagreements per pair therefore settles "is this the
# same wire?" outright, which coincident edges never can - D1 and D2 share 399
# coincident edges and are plainly different wires. That test is the entire
# point of the current run.
#
# Scoring one captured buffer many times, rather than capturing once per
# hypothesis, means no hypothesis can win because its run happened to be
# busier. It also means the whole permutation sweep costs one flash instead of
# one OTA push per guess.
#
# Ten lines would be 151 200 ordered HD44780 permutations if all of them were
# signals. They are not: the sweep first works out which lines actually moved
# and permutes only those. On this header the expectation is six live signals
# (RS, E, D4-D7) plus RW strapped low, two grounds and a supply - so 720
# trials, the same as hand-picking the right six, without having to know which
# six in advance. The log prints the active set and what it excluded.
#
# --- Before trusting anything it prints ------------------------------------
#
# 1. Confirm the backlight cathode really is logic ground. Pump unplugged,
#    continuity from that pad to LCD header pin 4 (VSS). Many panels dim by
#    switching the CATHODE low-side, which reads ~0 V but is a switching node,
#    not a reference. If the sweep reports mains coupling, this is the first
#    thing to re-check.
#
# 2. Every voltage quoted above predates the bond and was taken against a
#    floating reference. Re-measure against the bonded ground before acting on
#    any of it. Anything above 3.3 V must come off the XIAO.
#
# 3. Exercise the board DURING the capture window. Press MODE, cycle modes,
#    let the pump run. An event-driven header looks exactly like a dead one if
#    nothing happens while you are listening. No run so far has done this.
#
# --- Reading the result ----------------------------------------------------
#
# The verdict line is the summary; the per-pin table is the evidence. A null
# result is a real answer:
#
#   SAME WIRE: Dx == D1     ->  THE PAYOFF. That easy pin is the display
#   SAME WIRE: Dx == D2         clock (or data). Point clocked_tap in
#                               live.yaml at it and desolder the display wire.
#   INVERTED: Dx =! D1      ->  same net through a buffer. Usable, but check
#                               the edge polarity in clocked_tap.
#   A clear CLOCKED winner  ->  a serial bus. If it reads a pair from among
#   on two of the six           the six with no same-wire hit, that is a
#                               SECOND, independent bus on the easy connector.
#   A clear HD44780 winner  ->  copy E/RS/D4-D7 straight into the tap config.
#   NO TRAFFIC              ->  the display is not being refreshed, or the tap
#                               is not on the lines it thinks it is.
#   MAINS COUPLING          ->  the ground bond did not take. See (1).
#   NO MATCH, traffic       ->  something is talking but not HD44780. Check
#                               the active-line list against the header
#                               pinout before believing it.
#
# Do not act on a same-wire call from a single run. Press "Re-run Sweep" and
# confirm it reproduces, and check that a CLOCKED entry decodes recognisable
# panel text from the same pin. Two independent routes to the same answer is
# the bar; the runs 4-8 correction below is what happens without it.
#
# --- Run log ---------------------------------------------------------------
#
# Record results here as probe.yaml does. That inline history is the only
# reason the earlier six-line conclusion is still reconstructable.
#
# ===== Runs 1-3 were on the OTHER header: an unknown 6-pin connector =====
#
# Those ran with D0-D5 on a 6-pin header that is NOT the LCD header. Nothing
# they concluded transfers to the wiring below. Kept because run 3 is a
# finished result, not an open question.
#
# --- Run 1, 2026-09-18, board NOT exercised --------------------------------
#
# Captured 0 samples in 60 s while bus_probe, reflashed minutes later onto the
# same hardware, saw 420-5600 edges per 10 s window on D4. That looked like a
# broken capture path at the time.
#
# It was not. The D4 wire was loose (see run 3), so the header really did go
# quiet and then noisy again between flashes - an intermittent contact, not a
# firmware fault. The suspicion was still worth acting on: loop() now polls the
# port directly during capture, and a buffer that stays empty while the poll
# sees movement reports CAPTURE BROKEN instead of NO TRAFFIC. A false negative
# here ends the whole investigation, so it must never be the quiet outcome.
#
# --- Run 2, 2026-09-18, board NOT exercised --------------------------------
#
#   D0 D1 D2 D3   static HIGH, 0 edges
#   D5            static LOW,  0 edges
#   D4            ~310 edges/s, 15% high, 100% solitary, never coincident
#
#   D4 gap histogram (log2 us):  4-8us x772, 8-16us x165, then nothing until
#   2-4ms x214 and 16-32ms x225.
#
# That shape is threshold chatter, not data: tight bursts of 4-8 us crossings
# separated by millisecond-scale silence, which is what a slow analog swing
# does as it crawls through the input trip point. 100% solitary confirms it -
# D4 never once changed in the same port read as another line.
#
# Verdict: NO MATCH (best score 23.2, well under the 45 threshold). The eight
# tied HD44780 entries all render as "wwww..." because with five static lines
# every nibble decodes to the same constant 0x77; that tie is the signature of
# a degenerate fit, not a near miss.
#
# Reading at the time: four lines strapped high, one strapped low, one
# floating. Superseded by run 3 - D4 was simply not connected.
#
# --- Run 3, 2026-09-18, D4 reseated ----------------------------------------
#
#   D0 D1 D2 D3   static HIGH, 0 edges
#   D4 D5         static LOW,  0 edges
#
#   0 samples, 0 ISR calls, 0 polled changes, over the full 60 s.
#
# The chatter is gone: D4 now sits at a steady low, which is what it should
# have read all along. All three counters agreeing at zero is the important
# part - the polled cross-check and the interrupt path independently saw
# nothing, so this is a real silence rather than a capture that failed.
#
# Verdict: NO TRAFFIC. Four lines high, two low, nothing moving for a minute.
# A 6-pin header of four pulled-up lines and two grounds is the shape of a
# programming header (AVR ISP, PIC ICSP). Settled; the meter can finish it.
#
# ===== Run 4 onward: the 10-pin LCD header, all ten lines ================
#
# --- Runs 4-8, 2026-09-18, board NOT exercised -----------------------------
#
# RESULT: the display text is recoverable from two wires.
#
#   VERDICT: CLOCKED  CLK=D1/rise  DATA=D2  MSB-first  align2  (165 B)
#   decoded: ...@@@  |..|@  Standby Mode  |..|@   @@@...|@  Standby Mode  >@`>
#
# "Standby Mode" is the pump's own display text, decoded twice inside a single
# 0.4 s capture, and reproduced on three separate captures (runs 4, 6, 8) at
# the same clock/data pair. A twelve-character contiguous phrase is not
# something a wrong hypothesis produces by chance.
#
# >>> CORRECTION, 2026-09-18, after live.yaml decoded the bus properly. <<<
#
# The pins, edge and bit order above are right. "align2 (165 B)" is NOT - and
# it is worth understanding why, because the verdict looked like a decode and
# was not one.
#
# The bus uses 9-BIT WORDS: one flag bit, then the byte. This sweep only ever
# tried 8-bit words, so it could not read this bus. Replaying a real captured
# frame through the sweep's own decode logic:
#
#   8 bits, all 8 alignments   nothing - not on one frame, not on eight
#                              concatenated (382 % 8 = 6, so frame boundaries
#                              shift the phase and it still never spells it)
#   9 bits, align0             |@  Standby Mode  >@`
#
# Under an 8-bit reading of real frames: zero hits on any known string across
# 61 unique frames x 8 alignments x both bit orders, best printable fraction
# 18/47, and only 100 ones in 376 bits. Under 9-bit words the same frames
# render "Time Mode", "Standby Mode", "NOT SET", "Always On" and
# "Not Recommended" exactly. See live.yaml for the full protocol.
#
# So where did THIS run's "Standby Mode" come from? Unknown. The obvious
# guess - that an 8-bit read drifts through a lucky phase - was tested and is
# false. A plausible but untested explanation is that this capture was missing
# about one edge in nine (the buffer filled in 0.4 s, mostly with D7/D8 noise),
# which would make the stored stream effectively 8 bits per word. The raw
# capture was not kept, so it cannot be settled. Recorded as unexplained
# rather than given a tidy story.
#
# bus_sweep now sweeps 8- and 9-bit words and prints the word length in its
# verdict, so a repeat of this run would report "MSB 9b". The general lesson is
# that a hypothesis family with a hidden fixed parameter fails by scoring well
# for the wrong reason, not by scoring badly - which is much harder to notice.
#
#   line  edges   edge/s   high%   solo%   reading
#   D0    0       0        100%    -       static HIGH
#   D1    2657    6648     96.0%   76%     CLOCK  - idles high, 11 us low pulses
#   D2    474     1186     92.9%   12%     DATA   - 399 edges coincident with D1
#   D3    0       0        0%      -       static LOW
#   D4    0       0        100%    -       static HIGH
#   D5    0       0        0%      -       static LOW
#   D6    0       0        100%    -       static HIGH
#   D7    1335    3340     18.9%   87%     noise  - solitary, nothing decodes
#   D8    5258    13157    55.9%   96%     noise  - locked to 50 Hz mains
#   D9    0       0        0%      -       static LOW
#
# D1 and D2 are a genuine pair: 399 coincident edges, and D2's 12% solitary
# rate says it almost never moves without D1. D7 and D8 are the opposite -
# 87% and 96% solitary, never in step with anything - which is the signature
# of a floating input, not a bus.
#
# --- What this does NOT establish ------------------------------------------
#
# Which LCD header pin D1 and D2 actually are. The sweep labels XIAO
# silkscreen, and the wiring order into the header was never recorded. That
# mapping needs the meter.
#
# The six static lines were read here as possibly four loose wires. RESOLVED,
# and it was the other branch: this panel takes a serial interface. Two wires
# carry the entire display, the other eight are rails and unused pins, and
# nothing needs re-seating. The loose-D4 precedent from runs 1-3 was good
# reason to check, but it was not the answer this time.
#
# HD44780 was never scored here: only four lines moved and the hypothesis
# needs six, so the permutation count was 0. That was read as a statement about
# the tap rather than a rejection of HD44780 - fair at the time, but the tap
# was fine and HD44780 is simply not what this panel speaks.
#
# --- Still outstanding -----------------------------------------------------
#
# 1. SAFETY. The +4.87 V and negative-bias rails are still in the tap. They
#    are among the static lines - the HIGHs are {D0, D4, D6} and the LOWs are
#    {D3, D5, D9}. Identify and disconnect them.
# 2. Meter D0-D9 against the bonded ground, and write down which LCD header
#    position each XIAO pin is on. Everything downstream needs that map.
# 3. ~~Re-seat the six static wires.~~ Dropped. They are static because they
#    are rails and unused pins; the display is entirely on D1 and D2.
# 4. ~~No run has had the pump's buttons worked during the capture window.~~
#    Done, but not here - a 0.4 s window cannot catch a human pressing a
#    button, which is why live.yaml exists. Button mapping is in that file.
#
# --- Component changes these runs forced -----------------------------------
#
# Run 4 found "Standby Mode" and the report buried it under MAINS COUPLING.
# Run 5 lost the phrase entirely. Three separate defects, all fixed:
#
#   * Mains vetoed every hypothesis, not just the ones reading the coupled
#     line. On a whole-header tap an unused floating line is ordinary, and it
#     was suppressing the only real finding in the report.
#   * Known-string matching only searched the ~40-character printable sample
#     kept for display, so a phrase further into the stream was invisible.
#     Whether a hypothesis is right cannot depend on where in the window the
#     interesting part fell.
#   * The clocked sweep chose its byte alignment by printable ratio alone,
#     before checking for known strings - so a shifted alignment with more
#     bytes in 0x20-0x7E beat the alignment that actually spelled something.
#
# A fourth: the runner-up used for the margin test is now the best hypothesis
# reading a DIFFERENT set of lines. Rising- and falling-edge variants of one
# clock necessarily score within a point of each other, and counting one as
# the other's rival made a clean result look contested by itself.
#
# ===== Run 9 onward: the 6-pin header, with D1/D2 as a reference =========
