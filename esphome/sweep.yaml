#
# --- But two of the six are probably not connected -------------------------
#
# D3 and D4 are almost certainly FLOATING, acting as antennas:
#
#   D3   19.8 ms cycle, halves 28/72   -> flagged MAINS outright
#   D4   19.9 ms cycle, halves 17/83   -> mains period, too lopsided to pass
#   both 68-80% solitary, and gap histograms with the 2-4 us chatter peak
#
# A driven logic line cannot do that. Mains pickup at 50 Hz on a high-impedance
# input is the signature of a wire that is not making contact - the same fault
# that cost runs 1 and 2, and on D4/GPIO22, the same XIAO pin. Check both
# before reading anything into their rows.
#
# It does not change the answer. A line carrying the display clock would be
# driven and could not float. But until they are reseated, D3 and D4 are
# untested rather than tested-negative.
#
# --- What the six actually are ---------------------------------------------
#
#   D5 D6 D9 D10   static HIGH, 0 edges, rock steady over 0.58 s
#   D3 D4          unknown - not connected
#
# Four pulled-up lines with no traffic is the same shape runs 1-3 found on this
# header (four high, two low) and points the same way: a programming or test
# header, idle. THE METER FINISHES THIS, not more firmware. DC volts on each of
# the six against the bonded ground, pump unplugged for continuity.
