# Smart Hauswasserwerk - HD44780 LCD bus sniffer
#
# Target: Seeed Studio XIAO ESP32C6 (ESP32-C6FH4, 4MB flash, native USB-Serial/JTAG)
# Tapped device: Parkside PHGA 1300 A1 display/control board, 2x16 character LCD
#
# The pump's MCU drives its LCD over a 4-bit HD44780 bus with RW strapped low.
# This firmware watches RS/E/D4-D7, rebuilds the controller's DDRAM, and
# publishes the two rendered rows. It is strictly listen-only: all six taps are
# configured as inputs and no code path drives them. Because the pump never
# reads back (RW low), there is no bus contention to create even in a fault.
#
# Flash probe.yaml first. Until the bus probe has identified which line is E
# and which is RS, the pin roles below are guesses and this firmware will
# decode garbage.
#
# BLOCKED as of 2026-08-16. probe.yaml has run on the six-line tap and found no
# bus at all: four lines immovably clamped high, two cycling at 50 Hz, and not
# one coincident edge in ~150k samples. The pump's reference floats with
# respect to ours, so no pin mapping can rescue this. Do not chase the data
# ordering and do not read anything this firmware publishes until the ground
# reference is fixed - by isolation, not by bonding. See README.md,
# "The tap is blocked on isolation".

substitutions:
  name: hauswasserwerk
  friendly_name: Hauswasserwerk

  # --- Tap pin map -------------------------------------------------------
  # XIAO silkscreen D0-D5, a contiguous run for a tidy ribbon. Every one is
  # below GPIO24, so a single GPIO_IN_REG read latches all six atomically,
  # and none of them is an ESP32-C6 strapping pin (those are 8, 9 and 15).
  #
  # Which header pin carries which role is NOT yet known. Identify E and RS
  # from the bus probe's edge statistics first, then sweep the 24 remaining
  # data orderings by editing the four d*_pin lines below and pushing OTA.
  # No rewiring needed for any of it.
  tap_e_pin: GPIO0 # D0
  tap_rs_pin: GPIO1 # D1
  tap_d4_pin: GPIO2 # D2
  tap_d5_pin: GPIO21 # D3
  tap_d6_pin: GPIO22 # D4
  tap_d7_pin: GPIO23 # D5

packages:
  common: !include common.yaml

# --- The tap ---------------------------------------------------------------
hd44780_tap:
  id: lcd_tap
  e_pin: ${tap_e_pin}
  rs_pin: ${tap_rs_pin}
  d4_pin: ${tap_d4_pin}
  d5_pin: ${tap_d5_pin}
  d6_pin: ${tap_d6_pin}
  d7_pin: ${tap_d7_pin}
  columns: 16

  # Nibbles carry no framing bits, so a stream joined mid-byte stays off by one
  # forever and still decodes into plausible-looking text. Two boundary signals
  # break that: a change in RS (which is held for a whole byte), and an idle gap
  # longer than this. 200us is deliberately conservative - tighten it only once
  # the real inter-nibble and inter-byte gaps have been measured by the probe,
  # because a value below the true inter-nibble gap corrupts every byte.
  idle_gap: 200us

  # Set true to log every E edge and every decoded byte. This is how the data
  # pin order gets solved; turn it off once the mapping is confirmed, since it
  # is far too chatty for normal running.
  raw_capture: false

  line_1:
    name: "LCD Line 1"
  line_2:
    name: "LCD Line 2"

  # Diagnostics that answer the two questions the design depends on:
  # how fast is E actually strobing, and are we losing edges to ISR latency?
  # ESP32 GPIO interrupt latency runs ~2-3us with jitter once WiFi is active.
  edge_rate:
    name: "LCD Edge Rate"
  dropped_samples:
    name: "LCD Dropped Samples"
