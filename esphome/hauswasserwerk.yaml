# Smart Hauswasserwerk - UART tap probe firmware
#
# Target: Seeed Studio XIAO ESP32C6 (ESP32-C6FH4, 4MB flash, native USB-Serial/JTAG)
#
# Stage 1 firmware: passively listens on the tapped UART line and dumps every
# received frame as both hex and ASCII, so the protocol can be reverse
# engineered from the logs. No bytes are ever transmitted back to the tapped
# board (rx_pin only, no tx_pin) - this is strictly listen-only.

substitutions:
  name: hauswasserwerk
  friendly_name: Hauswasserwerk

  # --- Tap configuration -------------------------------------------------
  # D7 on the XIAO silkscreen == GPIO17. Wire this to the TX line of the
  # board being tapped, and tie the two grounds together.
  tap_rx_pin: GPIO17
  # Unknown until we see traffic. If the logs show garbage/no data, change
  # this and reflash - common values: 1200 2400 4800 9600 19200 38400 57600 115200
  tap_baud_rate: "9600"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    # Priority 800 runs after hardware init but before WiFi comes up, so the
    # antenna path is settled before the radio is used.
    priority: 800
    then:
      - output.turn_off: rf_switch_enable
      - output.turn_off: antenna_select

esp32:
  board: seeed_xiao_esp32c6
  framework:
    # ESP32-C6 is only supported via ESP-IDF, not the Arduino framework.
    type: esp-idf

# --- Antenna ---------------------------------------------------------------
# The XIAO ESP32C6 routes its radio through an RF switch. Seeed's docs are
# inconsistent about which of GPIO3/GPIO14 is "enable" and which is "select",
# so both are driven LOW: under either reading that selects the on-board
# ceramic antenna. Set antenna_select HIGH only if you fit a u.FL antenna.
output:
  - platform: gpio
    pin: GPIO3
    id: rf_switch_enable
  - platform: gpio
    pin: GPIO14
    id: antenna_select

# --- Connectivity ----------------------------------------------------------
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Raises its own hotspot if the network is unreachable, so the board in the
  # cellar never becomes unrecoverable without a USB cable.
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ap_password

captive_portal:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

# Lets us watch the tap live in a browser without Home Assistant.
web_server:
  port: 80

# --- Logging ---------------------------------------------------------------
logger:
  level: DEBUG
  # Pin logging to the native USB port so it cannot collide with the hardware
  # UART used for the tap.
  hardware_uart: USB_SERIAL_JTAG

# --- The tap ---------------------------------------------------------------
uart:
  id: tap_uart
  rx_pin: ${tap_rx_pin}
  baud_rate: ${tap_baud_rate}
  # Generous buffer so bursts are not dropped while the log drains.
  rx_buffer_size: 2048
  debug:
    direction: RX
    # Nothing else consumes this UART, so the debug hook sees every byte.
    dummy_receiver: true
    after:
      bytes: 256
      # Idle gap ends a frame - this is what reveals the message framing of an
      # unknown protocol.
      timeout: 40ms
    sequence:
      - lambda: UARTDebug::log_hex(direction, bytes, ' ');
      - lambda: UARTDebug::log_string(direction, bytes);

# --- Diagnostics -----------------------------------------------------------
sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
    entity_category: diagnostic

  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      entity_category: diagnostic

button:
  - platform: restart
    name: "Restart"
    entity_category: diagnostic
