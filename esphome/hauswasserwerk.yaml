# Smart Hauswasserwerk - HD44780 LCD bus sniffer
#
# Target: Seeed Studio XIAO ESP32C6 (ESP32-C6FH4, 4MB flash, native USB-Serial/JTAG)
# Tapped device: Parkside PHGA 1300 A1 display/control board, 2x16 character LCD
#
# ======================= THIS FIRMWARE IS SUPERSEDED ========================
#
# Use live.yaml instead. This file's premise is wrong for this pump.
#
# The panel is NOT a 4-bit HD44780 parallel bus. It is a two-wire clocked
# serial stream, decoded and confirmed against real traffic on 2026-09-18:
#
#   D1 clock (rising edge), D2 data, MSB-first
#   9-BIT WORDS - one flag bit, then the byte
#   each display line introduced by payload 7C 40, then 16 character words
#   line 2 starts two bits out of phase with line 1
#   ~10 frames/s, 382 bits per frame, 191 when only one line is drawn
#
# live.yaml renders that continuously and has been watched through a full pass
# of the MODE button: Standby -> Automatic -> Time -> Always On -> Standby.
#
# The evidence that killed the parallel model: with all ten header lines tapped
# on D0-D9, only FOUR carried edges and two of those were noise. A 4-bit
# HD44780 bus needs RS, E and D4-D7 all moving. That was first read as four
# loose wires - it was not. Two wires carry the whole display.
#
# Nothing below has ever decoded a byte off this board. It is kept because the
# HD44780 decoder is correct for panels that do use that bus, and because
# hd44780_core is shared with bus_sweep. If you are working on THIS pump, you
# want live.yaml.
#
# ============================================================================
#
# Everything from here down is the original parallel-bus configuration, left
# intact. The isolation question it was once blocked on is settled: the logic
# section is decoupled from mains and the pump's 0 V is bonded to the XIAO's
# GND pin. The earlier probe run - four lines clamped high, two cycling at
# 50 Hz, no coincident edges in ~150k samples - was an unbonded but isolated
# secondary floating on interwinding capacitance, which looks identical to a
# non-isolated supply until you bond it.

substitutions:
  name: hauswasserwerk
  friendly_name: Hauswasserwerk

  # --- Tap pin map -------------------------------------------------------
  # XIAO silkscreen D0-D5, a contiguous run for a tidy ribbon. Every one is
  # below GPIO24, so a single GPIO_IN_REG read latches all six atomically,
  # and none of them is an ESP32-C6 strapping pin (those are 8, 9 and 15).
  #
  # Which header pin carries which role is NOT yet known. Identify E and RS
  # from the bus probe's edge statistics first, then sweep the 24 remaining
  # data orderings by editing the four d*_pin lines below and pushing OTA.
  # No rewiring needed for any of it.
  tap_e_pin: GPIO0 # D0
  tap_rs_pin: GPIO1 # D1
  tap_d4_pin: GPIO2 # D2
  tap_d5_pin: GPIO21 # D3
  tap_d6_pin: GPIO22 # D4
  tap_d7_pin: GPIO23 # D5

packages:
  common: !include common.yaml

# --- The tap ---------------------------------------------------------------
hd44780_tap:
  id: lcd_tap
  e_pin: ${tap_e_pin}
  rs_pin: ${tap_rs_pin}
  d4_pin: ${tap_d4_pin}
  d5_pin: ${tap_d5_pin}
  d6_pin: ${tap_d6_pin}
  d7_pin: ${tap_d7_pin}
  columns: 16

  # Nibbles carry no framing bits, so a stream joined mid-byte stays off by one
  # forever and still decodes into plausible-looking text. Two boundary signals
  # break that: a change in RS (which is held for a whole byte), and an idle gap
  # longer than this. 200us is deliberately conservative - tighten it only once
  # the real inter-nibble and inter-byte gaps have been measured by the probe,
  # because a value below the true inter-nibble gap corrupts every byte.
  idle_gap: 200us

  # Set true to log every E edge and every decoded byte. This is how the data
  # pin order gets solved; turn it off once the mapping is confirmed, since it
  # is far too chatty for normal running.
  raw_capture: false

  line_1:
    name: "LCD Line 1"
  line_2:
    name: "LCD Line 2"

  # Diagnostics that answer the two questions the design depends on:
  # how fast is E actually strobing, and are we losing edges to ISR latency?
  # ESP32 GPIO interrupt latency runs ~2-3us with jitter once WiFi is active.
  edge_rate:
    name: "LCD Edge Rate"
  dropped_samples:
    name: "LCD Dropped Samples"
